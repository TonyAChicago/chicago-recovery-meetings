name: Verify LifeRing importer
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-lifering.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test official LifeRing import independently
        run: |
          python3 scripts/import_lifering.py
          python3 - <<'PY'
          import json
          with open("data/lifering.json",encoding="utf-8") as f: rows=json.load(f)
          assert len(rows)==1, f"Unexpected LifeRing count: {len(rows)}"
          r=rows[0]
          assert r["program"]=="LifeRing Secular Recovery" and r["day"]==3 and r["start"]=="19:00"
          print(f"VERIFIED: {len(rows)} Chicago LifeRing listing: {r['title']} {r['start']}")
          PY
