name: Probe public meeting data endpoints
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-sources.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe source endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import re,json
          urls={
            "chicagoaa-meetings":"https://www.chicagoaa.org/meetings/",
            "chicagoaa-api":"https://www.chicagoaa.org/wp-json/",
            "chicagoaa-tsml":"https://www.chicagoaa.org/wp-content/plugins/12-step-meeting-list/meeting-guide.php",
            "ca-locations":"https://www.illinoisareaca.org/locations",
            "ca-tsml":"https://www.illinoisareaca.org/wp-content/plugins/12-step-meeting-list/meeting-guide.php",
            "rd-locations":"https://recoverydharmachicago.org/locations/",
            "rd-tsml":"https://recoverydharmachicago.org/wp-content/plugins/12-step-meeting-list/meeting-guide.php",
            "rd-meetings":"https://recoverydharmachicago.org/meetings/?tsml-day=any",
            "aca":"https://adultchildren.org/meeting-person/",
            "lifering":"https://meetings.lifering.org/meetings/",
            "cma":"https://www.cmachicago.org/meetings",
            "alanon":"https://niafg.org/meetings/",
          }
          # Preview representative source table markup without exposing private contacts.
          from html.parser import HTMLParser
          class Rows(HTMLParser):
              def __init__(self):
                  super().__init__();self.depth=0;self.rows=[];self.cur=None;self.cell=None;self.link=None
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=="tr":
                      self.cur={"attrs":attrs,"cells":[],"links":[]}
                  elif self.cur is not None and tag in ("td","th"):
                      self.cell={"attrs":attrs,"text":""}
                  elif self.cur is not None and tag=="a":
                      self.link=attrs.get("href","")
                      if self.link:self.cur["links"].append(self.link)
              def handle_data(self,data):
                  if self.cell is not None:self.cell["text"]+=data
              def handle_endtag(self,tag):
                  if tag in ("td","th") and self.cell is not None:
                      self.cell["text"]=" ".join(self.cell["text"].split())[:160]
                      self.cur["cells"].append(self.cell);self.cell=None
                  if tag=="tr" and self.cur is not None:
                      if self.cur["cells"]:self.rows.append(self.cur)
                      self.cur=None
          for key,url in urls.items():
              try:
                  req=Request(url,headers={"User-Agent":"ChicagoRecoveryMeetings/0.4 (community recovery directory)", "Accept":"text/html"})
                  with urlopen(req,timeout=16) as r:
                      b=r.read(400000).decode("utf-8","replace")
                      parser=Rows();parser.feed(b)
                      print(json.dumps({"source":key,"rows":parser.rows[:4]},ensure_ascii=False))
              except Exception as e:print(json.dumps({"source":key,"error":str(e)[:160]}))
          PY
