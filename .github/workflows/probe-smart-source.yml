name: Inspect independent SMART meeting source
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-smart-source.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public meeting directory
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import re
          urls=[
             "https://sobasearch.com/meetings/us/illinois/smart",
             "https://sobasearch.com/meetings/us/illinois/smart?page=2",
             "https://sobasearch.com/meetings/il/chicago?program=smart",
             "https://sobasearch.com/meetings/il/chicago?fellowship=smart",
             "https://sobasearch.com/meetings/il/chicago?page=2",
             "https://sobasearch.com/search?program=SMART&location=Chicago"
          ]
          for u in urls:
            try:
              req=Request(u,headers={"User-Agent":"ChicagoRecoveryMeetings/0.5 (public support directory)","Accept":"text/html,text/plain"})
              with urlopen(req,timeout=20) as resp:
                s=resp.read(1200000).decode("utf-8","replace")
                print("URL",u,"STATUS",resp.status,"LENGTH",len(s),"TYPE",resp.headers.get("Content-Type"))
              if "robots.txt" in u: print("ROBOTS",s[:2000])
              else:
                print("TITLE",re.findall(r"<title[^>]*>(.*?)</title>",s,re.I|re.S)[:1])
                print("SMARTLINKS",list(dict.fromkeys(re.findall(r'href="([^"]*smart[^"]+)"',s,re.I)))[:22])
                for needle in ("SMART Recovery USA - Meeting #3016","2942 W Lake","In-person meeting","Wednesday at"):
                  pos=s.find(needle)
                  print("NEEDLE",needle,pos,"AROUND",s[max(0,pos-900):pos+1400][:2300] if pos>=0 else "")
            except Exception as e:print("ERROR",u,str(e)[:240])
          PY
