name: Evaluate public Chicago AA feed
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-aa-source.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect source structure and crawler policy
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          import re
          base="https://recoverystarts.com"
          for path in ("/robots.txt","/meetings/aa/chicago/"):
            url=base+path
            try:
              req=Request(url,headers={"User-Agent":"ChicagoRecoveryMeetings/0.5 (+https://github.com/TonyAChicago/chicago-recovery-meetings)","Accept":"text/html,text/plain"})
              with urlopen(req,timeout=25) as resp:
                html=resp.read(4000000).decode("utf-8","replace")
                print("SOURCE",url,"STATUS",resp.status,"TYPE",resp.headers.get("Content-Type"),"BYTES",len(html))
              if path.endswith("robots.txt"):
                print("ROBOTS_BEGIN",html[:1800],"ROBOTS_END")
              else:
                print("HTML_TITLE",re.findall(r"<title[^>]*>(.*?)</title>",html,re.I|re.S)[:1])
                print("TIME_COUNTS",len(re.findall(r"\\b(0?[1-9]|1[0-2]):[0-5][0-9]\\s*[AP]M",html,re.I)))
                print("LINK_EXAMPLES",re.findall(r'href="([^"]*/meetings/aa/chicago/[^"]+)"',html,re.I)[:8])
                for term in ("Fresh Start Beginners","Mustard Seed","Speaker - Closed"):
                  pos=html.find(term)
                  print("MATCH",term,pos,html[max(0,pos-1300):pos+1800][:3100])
                  if pos>=0:break
            except Exception as e:print("FAIL",url,str(e)[:220])
          PY
