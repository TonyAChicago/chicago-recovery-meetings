name: Refresh Chicago recovery meetings

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/import_na.py"
      - "scripts/import_other.py"
      - ".github/workflows/refresh-and-deploy.yml"

permissions:
  contents: write

concurrency:
  group: recovery-na-refresh
  cancel-in-progress: false

jobs:
  refresh-meetings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Chicagoland NA data
        id: import
        shell: bash
        run: |
          if python3 scripts/import_na.py; then
            echo "import_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NA import failed; preserving existing NA data."
            echo "import_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Cocaine Anonymous and Recovery Dharma
        id: other
        shell: bash
        run: |
          if python3 scripts/import_other.py; then
            echo "other_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::One or more fellowship source imports failed; existing data was preserved."
            echo "other_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate meeting files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("meetings", "na", "ca", "rd_live", "s_fellowships"):
              path = Path("data") / (name + ".json")
              rows = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(rows, list), f"{path} must contain an array"
              print(f"{path}: {len(rows)} records")
          PY

      - name: Commit refreshed meeting data
        shell: bash
        run: |
          if ! git diff --quiet -- data/na.json data/ca.json data/rd_live.json data/s_fellowships.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/na.json data/ca.json data/rd_live.json data/s_fellowships.json
            git commit -m "Refresh Chicago recovery meeting listings"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Meeting records unchanged."
          fi

# GitHub Pages is currently deployed from the main branch using GitHub's
# built-in "pages build and deployment" workflow. Do not deploy a second
# Pages artifact here: that duplicate deployment failed even when the
# normal branch-based Pages deployment succeeded.
